services:
  # Servicio de Base de Datos
  db:
    image: postgres:15-alpine  # Usamos una imagen ligera de PostgreSQL 15
    container_name: mikedb_container2
    restart: always
    environment:
      POSTGRES_USER: mike2
      POSTGRES_PASSWORD: super_secret_password2
      POSTGRES_DB: mikedb2
    ports:
      - "5432:5432"  # Mapea el puerto del contenedor al de su máquina local
    volumes:
      - postgres_data2:/var/lib/postgresql/data  # Persistencia de datos

# Definición del volumen para que los datos no se pierdan al reiniciar
volumes:
  postgres_data2: